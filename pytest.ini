[pytest]
# Pytest configuration for coral-python

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes
    -ra
    # Every plugin will carry a tests/unit/test_functions.py of its own, and no tests/ directory
    # ships an __init__.py — importlib mode imports each test module without deriving a package
    # name from its path, so identical basenames in different packages do not collide. There is no
    # ini key for this; addopts is where pytest takes it.
    --import-mode=importlib

# Test paths. Two trees: the repo-level suite (tests that name no plugin) and each package's own
# suite — the framework's two at the root, then every plugin. The glob is expanded by pytest; a
# package without a tests/ directory simply contributes nothing.
#
# The same three source roots are listed in `pyproject.toml` (workspace members, coverage source) and
# derived in `tests/invariants/test_source_rules.py`. pytest cannot read a Python constant, so this
# list is duplicated on purpose; `TestConfigCoversEveryDistribution` there parses this file and fails
# if a distribution's tests/ directory is matched by no entry below — the one omission that would
# otherwise be invisible, since an uncollected suite leaves the run green.
testpaths = tests coral-core/tests coral-app/tests plugins/*/tests

# Markers. Both are about *cost*, not about which plugin a test needs: selection by plugin is now
# selection by **path** (`pytest plugins/coral-math/tests`), because each plugin's tests live in that
# plugin's package and guard themselves there. The `math` / `string` / `phiflow` markers went with the
# auto-skip hook they existed for (issue #27, R3).
#
# The two are independent properties, not a partition, so a test may carry both — and one does:
# `slow` is "costs real time" (the simulation: deterministic, offline, always ~33s), `network` is
# "needs the internet" (the wheel acceptance test: 4s with a warm uv cache, ~250s when PyPI has
# published a jax the workspace does not pin, since `uv pip install` resolves fresh and ignores
# `uv.lock`). They fail for different reasons — a simulation failure is a code defect, a download
# failure is an environment problem — which is why `-m "not network"` is a lane worth having.
markers =
    slow: Tests that take significant time to run — a fluid simulation, or a wheel build
    network: Tests that need the internet — they download from PyPI, so they fail offline

# Minimum Python version
minversion = 3.8

# Configure warnings
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:jit_compile\(\) not supported by numpy:RuntimeWarning
    ignore:spsolve requires A be CSC or CSR matrix format:scipy.sparse._base.SparseEfficiencyWarning
    ignore:Rank deficiency >= 1 detected in linear solve:RuntimeWarning