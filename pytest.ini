[pytest]
# Pytest configuration for coral-python

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes
    -ra
    # Every plugin will carry a tests/unit/test_functions.py of its own, and no tests/ directory
    # ships an __init__.py — importlib mode imports each test module without deriving a package
    # name from its path, so identical basenames in different packages do not collide. There is no
    # ini key for this; addopts is where pytest takes it.
    --import-mode=importlib

# Test paths. Two trees: the repo-level suite (tests that name no plugin) and each package's own
# suite. The glob is expanded by pytest; a package without a tests/ directory simply contributes
# nothing.
testpaths = tests packages/*/tests

# Markers. Only one is left, and it is about *cost*, not about which plugin a test needs: selection by
# plugin is now selection by **path** (`pytest packages/coral-plugin-math/tests`), because each plugin's
# tests live in that plugin's package and guard themselves there. The `math` / `string` / `phiflow`
# markers went with the auto-skip hook they existed for (issue #27, R3).
markers =
    slow: Tests that take significant time to run — a fluid simulation, or a wheel build

# Minimum Python version
minversion = 3.8

# Configure warnings
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:jit_compile\(\) not supported by numpy:RuntimeWarning
    ignore:spsolve requires A be CSC or CSR matrix format:scipy.sparse._base.SparseEfficiencyWarning
    ignore:Rank deficiency >= 1 detected in linear solve:RuntimeWarning