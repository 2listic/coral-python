# Pre-commit hooks (issue #20): verify formatting and run static analysis before a commit lands.
#
# Local hooks on purpose. Ruff comes from the dev group pinned in `uv.lock`, so the hook and a
# developer typing `uv run ruff` can never disagree about the version -- there is no second pin to
# keep in step. `--frozen` skips lockfile re-resolution on every commit; `--force-exclude` makes
# ruff honour the `extend-exclude` in pyproject.toml even for explicitly-passed paths, which is how
# pre-commit invokes it.
#
# The test hook runs the fast lane only. Both costly markers stay out of a commit: `slow` is the
# ~33s fluid simulation, and the wheel acceptance test carries `slow` *and* `network`, so excluding
# `slow` is also what keeps the hook offline. The full suite is `uv run pytest`.
#
# Install with: uv run pre-commit install
repos:
  - repo: local
    hooks:
      # Rewrites offending files, which aborts the commit -- `git add` them and commit again.
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      # Reports only (no --fix): lint changes are never applied behind the author's back.
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      # Runs on every commit whatever is staged (`always_run`): a graph JSON, `pyproject.toml` or
      # `pytest.ini` change can break a test exactly as a `.py` can. `-q` cancels the `-v` in
      # pytest.ini -- pre-commit shows this output only on failure, and what one reads there is the
      # tracebacks and the `-ra` summary, not a 500-line inventory of test names.
      - id: pytest
        name: pytest (fast lane)
        entry: uv run --frozen pytest -m "not slow" -q
        language: system
        pass_filenames: false
        always_run: true
